<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Master the trace. Build the streak in Swipe God.">
  <meta name="theme-color" content="#000000">
  
  <title>Swipe God</title>

  <!-- =========================
       ADSENSE (MONETIZATION)
  ========================== -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7708023438338001"
    crossorigin="anonymous"></script>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
     MAIN MENU OVERLAY
========================== -->
<div id="menu">
  <div class="bg-orb"></div>

  <div class="title-wrap">
    <h1>SWIPE GOD</h1>
    <p>Master the trace. Build the streak.</p>
  </div>

  <div class="tap-hint">TAP TO BEGIN</div>
  <button class="play" onclick="startGame()">PLAY</button>
</div>

<!-- =========================
     GAME RENDER SURFACE
========================== -->
<canvas id="gameCanvas"></canvas>

<!-- =========================
     ADS CONTAINER
========================== -->
<div id="ad-container">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7708023438338001"
       data-ad-slot="9146349585"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>

<!-- =========================
     GAME ENGINE ENTRY FILE
========================== -->
<script src="game.js"></script>

<script>
  let gameStarted = false;

  function startGame() {
    const menu = document.getElementById("menu");

    menu.style.transition = "opacity .25s ease, transform .25s ease";
    menu.style.opacity = "0";
    menu.style.transform = "scale(1.05)";

    setTimeout(() => {
      menu.style.display = "none";
      gameStarted = true;

      if (typeof init === "function") {
        init();
      } else {
        console.error("[SwipeGod] init() not found in game.js");
      }
    }, 250);
  }

  window.addEventListener("DOMContentLoaded", () => {
    // Safely trigger AdSense rendering once DOM is ready
    (window.adsbygoogle = window.adsbygoogle || []).push({});

    // Prevent touch gestures/swiping prior to game start
    const canvas = document.getElementById("gameCanvas");
    if (canvas) {
      canvas.addEventListener("pointerdown", (e) => {
        if (!gameStarted) e.preventDefault();
      });
    }
  });
</script>

</body>
</html>
