<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swipe God</title>

  <!-- ADSENSE SCRIPT (LOAD ONCE) -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7708023438338001"
    crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    /* HOME SCREEN */
    #menu {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #001f26, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #menu h1 {
      color: #00ffcc;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #00ffcc;
    }

    #menu button {
      padding: 15px 40px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      color: black;
      cursor: pointer;
    }

    /* GAME CANVAS LAYER */
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BOTTOM AD */
    #ad-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.6);
      z-index: 10000;
    }
  </style>
</head>

<body>

<!-- HOME SCREEN -->
<div id="menu">
  <h1>SWIPE GOD</h1>
  <button onclick="startGame()">PLAY</button>
</div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- AD BANNER (BOTTOM FIXED) -->
<div id="ad-container">

  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7708023438338001"
       data-ad-slot="9146349585"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>

</div>

<!-- PUSH ADS AFTER ELEMENT EXISTS -->
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- GAME SCRIPT -->
<script src="game.js"></script>

<!-- MENU LOGIC -->
<script>
  let gameStarted = false;

  function startGame() {
    document.getElementById("menu").style.display = "none";
    gameStarted = true;
  }

  window.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById("gameCanvas");

    canvas.addEventListener("pointerdown", e => {
      if (!gameStarted) e.preventDefault();
    });
  });
</script>

</body>
</html>
