<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swipe God</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    /* HOME SCREEN */
    #menu {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #001f26, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #menu h1 {
      color: #00ffcc;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #00ffcc;
    }

    #menu button {
      padding: 15px 40px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      color: black;
      cursor: pointer;
      box-shadow: 0 0 20px #00ffcc;
    }

    #menu button:hover {
      transform: scale(1.05);
    }

    /* AD BANNER */
    #ad-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
    }
  </style>
</head>

<body>

<!-- HOME SCREEN -->
<div id="menu">
  <h1>SWIPE GOD</h1>
  <button onclick="startGame()">PLAY</button>
</div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- BOTTOM AD -->
<div id="ad-container">
  
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7708023438338001"
       data-ad-slot="2222222222"
       data-ad-format="auto"></ins>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

<script src="game.js"></script>

<script>
  // prevent auto start
  let gameStarted = false;

  function startGame() {
    document.getElementById("menu").style.display = "none";
    gameStarted = true;


  }

  // block canvas interaction until start
  document.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById("gameCanvas");

    canvas.addEventListener("pointerdown", e => {
      if (!gameStarted) e.preventDefault();
    });
  });
</script>

</body>
</html>
<!-- BOTTOM BANNER AD -->
<div id="ad-container" style="
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  background: rgba(0,0,0,0.6);
">

       style="display:block"

  <script>
     
  </script>
</div>

</body>
