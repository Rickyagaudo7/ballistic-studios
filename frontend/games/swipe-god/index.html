<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swipe God</title>

  <!-- =========================
       ADSENSE (MONETIZATION)
       NOTE: Must load before ads render
  ========================== -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7708023438338001"
    crossorigin="anonymous"></script>

  <!-- External stylesheet (ALL UI styles live here) -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- =========================
     MAIN MENU OVERLAY
     NOTE: This blocks gameplay until startGame() runs
     Controlled by JS state: gameStarted
========================== -->
<div id="menu">

  <!-- Background FX layer (purely visual) -->
  <div class="bg-orb"></div>

  <!-- Title block (branding layer) -->
  <div class="title-wrap">
    <h1>SWIPE GOD</h1>
    <p>Master the trace. Build the streak.</p>
  </div>

  <!-- UX hint (mobile onboarding signal) -->
  <div class="tap-hint">TAP TO BEGIN</div>

  <!-- Entry point into game loop -->
  <button class="play" onclick="startGame()">PLAY</button>
</div>

<!-- =========================
     GAME RENDER SURFACE
     NOTE: game.js controls all rendering logic here
========================== -->
<canvas id="gameCanvas"></canvas>

<!-- =========================
     ADS CONTAINER
     NOTE: Keep fixed position if UI overlays later
========================== -->
<div id="ad-container">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7708023438338001"
       data-ad-slot="9146349585"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>

<!-- Initialize ads AFTER DOM exists -->
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- =========================
     GAME ENGINE ENTRY FILE
     NOTE: Must expose init() function globally
========================== -->
<script src="game.js"></script>

<script>
  // =========================
  // GLOBAL GAME STATE FLAG
  // Controls input blocking before start
  // =========================
  let gameStarted = false;

  // =========================
  // START GAME FUNCTION
  // UI transition → disables menu → boots engine
  // =========================
  function startGame() {
    const menu = document.getElementById("menu");

    // Smooth transition out (UX polish layer)
    menu.style.transition = "opacity .25s ease, transform .25s ease";
    menu.style.opacity = "0";
    menu.style.transform = "scale(1.05)";

    // Delay ensures animation completes before DOM removal
    setTimeout(() => {
      menu.style.display = "none";
      gameStarted = true;

      // Defensive check (prevents runtime crash if game.js missing init)
      if (typeof init === "function") {
        init(); // boot game engine
      } else {
        console.error("[SwipeGod] init() not found in game.js");
      }
    }, 250);
  }

  // =========================
  // INPUT GUARD
  // Prevents accidental canvas interaction before game starts
  // =========================
  window.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById("gameCanvas");

    canvas.addEventListener("pointerdown", (e) => {
      if (!gameStarted) e.preventDefault();
    });
  });
</script>

</body>
</html>
