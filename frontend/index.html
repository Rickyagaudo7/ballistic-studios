<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ballistic Studios</title>

  <link rel="stylesheet" href="css/styles.css">

  <!-- Google AdSense (ONLY ONCE) -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7708023438338001"
    crossorigin="anonymous">
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle at top, #0a0f1a, #000);
      color: white;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .navbar h1 {
      font-size: 22px;
      color: #00ffcc;
    }

    .nav-actions button {
      margin-left: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #00ffcc;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .hero h2 {
      font-size: 40px;
    }

    .hero p {
      color: #aaa;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      padding: 40px;
    }

    .game-card {
      background: linear-gradient(145deg, #0f172a, #020617);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.02);
    }

    .game-title {
      font-size: 22px;
    }

    .game-desc {
      font-size: 14px;
      color: #aaa;
    }

    .play-btn {
      margin-top: 15px;
      display: inline-block;
      padding: 8px 14px;
      background: #00ffcc;
      color: black;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .featured {
      margin: 0 40px;
      padding: 30px;
      border-radius: 20px;
      background: linear-gradient(120deg, #001f26, #020617);
      border: 1px solid rgba(0,255,204,0.2);
      cursor: pointer;
    }

    /* ✅ AD TOP SAFE BLOCK */
    .ad-top {
      width: 100%;
      text-align: center;
      margin: 10px 0;
      min-height: 90px;
    }

    /* ✅ GAME OVERLAY SAFE LAYER */
    #gameOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #gameWindow {
      width: 90%;
      height: 90%;
      background: black;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px rgba(0,255,204,0.3);
    }

    #gameWindow button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: red;
      border: none;
      color: white;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

<!-- 🔥 TOP AD (SAFE + CLEAN) -->
<div class="ad-top">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7708023438338001"
       data-ad-slot="6116861565"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <h1>Ballistic Studios</h1>
  <div class="nav-actions">
    <button onclick="goToProfile()">Profile</button>
    <button onclick="goToAdmin()">Admin</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h2>Your Game Hub</h2>
  <p>Play. Compete. Master your reflexes.</p>
</div>

<!-- FEATURED -->
<div class="featured" onclick="openGame('swipe-god')">
  <h3>🔥 Featured: Swipe God</h3>
  <p>Trace the divine path with precision.</p>
  <span class="play-btn">Play Now</span>
</div>

<!-- GAME GRID -->
<div class="game-grid">
  <div class="game-card" onclick="openGame('swipe-god')">
    <div class="game-title">Swipe God</div>
    <div class="game-desc">Precision tracing & streak mastery</div>
    <span class="play-btn">Play</span>
  </div>

  <div class="game-card" onclick="openGame('math-runner')">
    <div class="game-title">Math Runner</div>
    <div class="game-desc">Solve fast or fall behind</div>
    <span class="play-btn">Play</span>
  </div>
</div>

<!-- 🎮 GAME OVERLAY (STABLE IFRAME SYSTEM) -->
<div id="gameOverlay">
  <div id="gameWindow">

    <button onclick="closeGame()">X</button>

    <iframe id="gameFrame"></iframe>

  </div>
</div>

<!-- JS -->
<script src="js/main.js"></script>

</body>
</html>
